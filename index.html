<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Step 3</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>body{margin:0}</style>
</head>
<body>
  <a-scene>
    <a-assets>
      <a-asset-item id="model" src="OilContainer.glb"></a-asset-item>
      <img id="pano" src="StreetView360.jpg">
    </a-assets>


    <!-- Cámara con posición y rotación personalizada -->
    <a-entity id="rig" position="200 1.6 0" rotation="-20 -40 0">
      <a-camera look-controls wasd-controls></a-camera>
    </a-entity>


    <!-- 3D Model - posicionado en los botes de basura -->
    <a-entity gltf-model="#model" position="280 -60 -90" scale="0.22 0.22 0.22" rotation="-85 130 0"></a-entity>


    <!-- 360 Environment -->
    <a-sky src="#pano" rotation="0 -90 0"></a-sky>
  </a-scene>
</body>
</html>
